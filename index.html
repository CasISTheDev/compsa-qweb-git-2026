<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The wall · COMPSA × QWeb</title>
<style>
  :root { --bg: #0d1117; --card: #161b22; --line: #30363d; --ink: #e6edf3; --muted: #8b949e; --accent: #3fb950; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: clamp(32px, 6vw, 56px); margin: 0 0 8px; letter-spacing: -1px; }
  p.lead { color: var(--muted); margin: 0 0 32px; font-size: 18px; }
  p.lead a { color: var(--accent); }
  .count { color: var(--accent); font-weight: 700; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
  .card h2 { margin: 0; font-size: 19px; }
  .card .user { color: var(--accent); font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; text-decoration: none; }
  .card p { margin: 8px 0 0; color: var(--muted); font-size: 15px; }
  .empty { color: var(--muted); }
  .card.new { animation: arrive 2.5s ease-out; }
  @keyframes arrive { from { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(63,185,80,.35); } }
  @media (prefers-reduced-motion: reduce) { .card.new { animation: none; } }
</style>
</head>
<body>
<main>
  <h1>The wall</h1>
  <p class="lead"><span class="count" id="count">0</span> people got here with their first pull request. Yours next: <a href="https://github.com/queens-web-development-club/compsa-qweb-git-2026/blob/main/EXERCISES.md">start the exercises</a>.</p>
  <div class="grid" id="grid"><p class="empty">Loading…</p></div>
</main>
<script>
  // Loads the wall now, then checks for new people every 15 seconds, so it can stay up on the projector.
  const grid = document.getElementById("grid");
  const seen = new Set();
  let first = true;
  function card(m) {
    const card = document.createElement("article"); card.className = "card";
    const h = document.createElement("h2"); h.textContent = m.name;
    const a = document.createElement("a"); a.className = "user"; a.href = "https://github.com/" + encodeURIComponent(m.user); a.textContent = "@" + m.user;
    const p1 = document.createElement("p"); p1.textContent = m.program;
    const p2 = document.createElement("p"); p2.textContent = m.fun;
    card.append(h, a, p1, p2);
    return card;
  }
  function load() {
    fetch("members.json?t=" + Date.now(), { cache: "no-store" })
      .then(r => r.json())
      .then(list => {
        if (first) grid.replaceChildren();
        else if (list.length) grid.querySelector(".empty")?.remove();
        for (const m of list) {
          if (seen.has(m.user)) continue;
          seen.add(m.user);
          const c = card(m);
          if (!first) c.classList.add("new");
          first ? grid.append(c) : grid.prepend(c);
        }
        document.getElementById("count").textContent = seen.size;
        if (!seen.size) grid.innerHTML = '<p class="empty">Nobody yet. Be the first.</p>';
        first = false;
      })
      .catch(() => { if (first) grid.innerHTML = '<p class="empty">Couldn\'t load the wall. Refresh in a minute.</p>'; });
  }
  load();
  setInterval(load, 15000);
</script>
</body>
</html>
